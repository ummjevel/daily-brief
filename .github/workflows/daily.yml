name: Daily Morning Brief

on:
  schedule:
    # UTC 21:00 = 다음 날 KST 06:00. 요일도 UTC 기준이라 한 칸 밀린다:
    # UTC 일~목(0-4) = KST 월~금. 주말에는 돌지 않는다.
    - cron: '0 21 * * 0-4'
  workflow_dispatch:  # 수동 트리거 가능

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate morning brief
        env:
          # 구독 계정 인증 (API 키 아님). `claude setup-token`으로 발급.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TZ: Asia/Seoul
        run: python scripts/main.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json docs/
          git diff --staged --quiet || git commit -m "chore: daily brief $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
